
name: Custom
description: Template para registrar piezas de diseño con sus parámetros de producción.
title: "[PROYECTO] "
labels: [""]
assignees:
  - octocat
type: bug
body:

  - type: textarea
    id: description_text
    attributes:
      label: Descripción
      description: Una breve descripión de lo que se necesita para completar esta tarea
    validations:
      required: true

  - type: dropdown
    id: canal_formato
    attributes:
      label: 📐 Canal_Formato
      description: Selecciona todos los canales y formatos aplicables.
      multiple: true
      options:
        - Facebook_1080x1080
        - Facebook_1920x1080
        - Facebook_4:3
        - Instagram_1080x1080
        - Instagram_Stories_1080x1920
        - TikTok_1080x1920
        - OOH_Personalizado
    validations:
      required: true

  - type: dropdown
    id: categoria_producto
    attributes:
      label: 🗂️ Categorías_Producto
      description: Selecciona la categoría y producto aplicable.
      options:
        - Performance_SaludTotal
        - Performance_BrandingdeProducto
        - Performance_Decesos
        - Performance_DobleProtección
        - Performance_MultifondosFlex
        - Performance_EndosoDevolución
        - Performance_SaludySCTR
        - Performance_Vida
        - Tradicional_HTMLs
        - Tradicional_SaludTotal
        - Tradicional_CXIndex
        - Tradicional_DiadelPadre
        - Tradicional_CasetasCamposanto
        - Tradicional_SCLDiplomasCorredores
        - Tradicional_Compartamos
        - Tradicional_UnidadDePrevención
        - Tradicional_Furgón
        - Tradicional_PlataformaSalud
        - Tradicional_LosBravos
        - Tradicional_PlataformaDecesos
        - Tradicional_SCL
        - Tradicional_ENLACE
    validations:
      required: true
